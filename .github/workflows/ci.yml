name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.0", "24.x", "26.x"]
        react: ["19.2.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run typecheck
      - run: npm run release:verify
        env:
          REACT_VERSION: ${{ matrix.react }}
      - name: Enable reviewed SQLite test binding
        run: npm rebuild better-sqlite3
      - run: npm test
      - run: npm run build
      - run: npm --prefix example install --ignore-scripts --no-package-lock --install-links
      - run: npm --prefix example run build
      - run: npm --prefix example test
      - run: npm run clean
