name: deploy demo to github pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_CONVEX_URL: ${{ vars.DEMO_CONVEX_URL }}
      DEMO_CONVEX_SITE_URL: ${{ vars.DEMO_CONVEX_SITE_URL }}
      VITE_CONVEX_URL: ${{ vars.DEMO_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.DEMO_CONVEX_SITE_URL }}
      VITE_BASE_PATH: /convex-agent-native/
    steps:
      - name: Refuse a stale successful CI revision
        run: |
          current_main_sha="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$current_main_sha"
          test "$current_main_sha" = "${{ github.event.workflow_run.head_sha }}"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.24.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Refuse missing or non-Convex deployment configuration
        run: node scripts/verify-demo-deployment.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build adapter package
        run: pnpm run build
      - name: Test demo
        run: pnpm --dir demo test
      - name: Build demo
        run: pnpm --dir demo run build
      - name: Record reproducible public deployment metadata
        run: node scripts/verify-demo-deployment.mjs --manifest demo/dist/deployment-manifest.json --source-revision "${{ github.event.workflow_run.head_sha }}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck the current main revision
        run: |
          current_main_sha="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$current_main_sha"
          test "$current_main_sha" = "${{ github.event.workflow_run.head_sha }}"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
