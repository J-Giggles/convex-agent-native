name: Feature proposal
description: Propose a focused addition to the tested compatibility boundary.
title: "[Proposal]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea. Explain the user problem before prescribing an API.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed boundary
      description: Describe the smallest public behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Authorization, persistence, and exposure impact
      description: Explain effects on scope, approvals, idempotency, audit, cost limits, and public transports.
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: I understand this package intentionally implements selected public contracts, not every upstream export.
          required: true
